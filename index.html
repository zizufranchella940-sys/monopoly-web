<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121A2B">
<meta name="apple-mobile-web-app-title" content="کارتخوان">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>کارتخوان مونوپولی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121A2B; --raised:#1B2640; --raised2:#223050; --line:#2E3C5E;
  --text:#F3F1EA; --muted:#98A3BC;
  --deed:#F4EFE3; --deed-ink:#1C1C1C; --deed-head:#1F5FB8;
  --red:#D7263D; --green:#1E9E5A; --blue:#2F6FE0; --orange:#F08A24; --gold:#E9B949;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#EDEAE1; --raised:#FFFFFF; --raised2:#F4F1E8; --line:#D6D0C2;
    --text:#1B2233; --muted:#5E6679; color-scheme:light;
  }
}
:root[data-theme="dark"]{ --ink:#121A2B; --raised:#1B2640; --raised2:#223050; --line:#2E3C5E; --text:#F3F1EA; --muted:#98A3BC; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,.key,.act{touch-action:manipulation}
body{margin:0;min-height:100%;background:var(--ink);color:var(--text);
  font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:var(--ink);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:0;background:transparent;width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center}
.icon:active{background:var(--raised)}
.wordmark{display:inline-block;background:var(--red);color:#fff;border:2px solid #fff;border-radius:6px;
  padding:6px 20px;font-weight:900;letter-spacing:3px;font-size:24px;direction:ltr;font-family:"Arial Black",Vazirmatn,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;
  border:0;padding:10px 16px;font-size:18px;font-weight:700;background:var(--raised2);color:var(--text)}
.btn.primary{background:var(--gold);color:#1a1a1a}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}.btn.orange{background:var(--orange);color:#1a1a1a}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.ghost.red{border-color:var(--red);color:var(--red);background:transparent}
.btn.ghost.blue{border-color:var(--blue);color:var(--blue);background:transparent}
.btn.ghost.green{border-color:var(--green);color:var(--green);background:transparent}
.btn.grp{flex-direction:column;gap:2px;min-height:60px;padding:6px 2px;font-size:14px}.btn.grp span{font-size:18px;line-height:1}
.btn.ghost.bk{border-color:var(--red);color:var(--red);border-width:2px;margin-top:10px;min-height:56px;font-size:18px;font-weight:800}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.list{background:var(--raised);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;
  background:transparent;border-left:0;border-right:0;border-top:0;text-align:right}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:17px}
.item .s{font-size:13.5px;color:var(--muted)}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
.inp{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--raised);
  padding:10px 12px;font-size:18px}
.inp:focus{border-color:var(--gold);outline:none}
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .grow{flex:1}
.sw input{width:24px;height:24px;accent-color:var(--gold)}
h2.sec{font-size:15px;color:var(--gold);margin:22px 4px 8px;font-weight:700}
/* ready screen */
.ready{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:10px 0}
.clock{font-size:56px;font-weight:300;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:40px;background:var(--raised);border:1px solid var(--line)}
.tapme{font-size:27px;font-weight:900;margin-top:6px}
.nfc{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;position:relative;font-size:48px}
.nfc::before,.nfc::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);opacity:0;animation:ring 2.2s infinite}
.nfc::after{animation-delay:1.1s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion: reduce){.nfc::before,.nfc::after{animation:none;opacity:.5}}
.foot{position:sticky;bottom:0;background:var(--ink);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ver{text-align:center;font-size:12.5px;color:var(--muted);margin-top:6px;background:none;border:0;width:100%}
/* deed card */
.deed{background:var(--deed);color:var(--deed-ink);border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);border:2px solid #fff}
.deed .head{background:var(--deed-head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.deed .head .n{flex:1;font-size:25px;font-weight:900}
.deed .body{padding:14px 16px;text-align:center}
.deed .bal{font-size:40px;font-weight:900;line-height:1.2}
.deed .bal small{font-size:16px;color:#666;font-weight:600}
.deed .last small{color:#777}
.deed .last{font-size:13.5px;color:#555;border-top:1px dashed #bbb;margin-top:10px;padding-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{min-height:92px;border-radius:16px;border:0;color:#fff;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act span{font-size:28px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:4px 12px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.sw8{width:54px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.25);flex:none}
.hs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.qc{flex:none;border:1px solid var(--line);background:var(--raised);border-radius:40px;padding:8px 14px;font-size:15px}
.pct{flex:1;border:1.5px solid var(--line);background:var(--raised);border-radius:14px;padding:8px 4px;text-align:center}
.pct b{display:block;font-size:19px}.pct small{color:var(--muted);font-size:12px}
.pct.on{border-width:2.5px}
/* keypad */
.amount{text-align:center;padding:10px 0}
.amount .v{font-size:48px;font-weight:900;line-height:1.2;word-break:break-all}
.keys{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{min-height:58px;border-radius:14px;border:0;background:var(--raised);font-size:26px;font-weight:600}
.key:active{background:var(--raised2)}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.66);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.scrim.center{align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--raised);width:100%;max-width:560px;max-height:85dvh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.dlg{background:var(--raised);width:100%;max-width:420px;max-height:88dvh;overflow:auto;border-radius:22px;padding:20px}
.dlg h3,.sheet h3{margin:0 0 12px;font-size:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}
.big-ok{font-size:64px;text-align:center;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;
  background:#000d;color:#fff;padding:12px 18px;border-radius:14px;max-width:92vw;text-align:center;font-size:15px;animation:fade .2s}
.empty{text-align:center;color:var(--muted);padding:40px 16px;line-height:2}
.plus{color:var(--green)}.minus{color:var(--red)}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.dot{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.dot.on{outline:3px solid var(--gold);outline-offset:2px}
.designs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dz{border:1.5px solid var(--line);background:var(--raised);border-radius:12px;padding:6px 2px;text-align:center;font-size:12px}
.dz b{display:block;font-size:26px;font-weight:400;line-height:1.3}
.dz.on{border-color:var(--gold);background:var(--raised2)}
.note{background:var(--raised);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.9}
.warn{border-right:4px solid var(--orange)}
/* نصب روی صفحه اصلی */
.install{display:flex;gap:14px;align-items:center}
.install svg{flex:none;width:64px;height:64px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.steps{margin:14px 0 4px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1a1a;display:grid;place-items:center;font-weight:800;font-size:14px}
.share{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--raised2);vertical-align:middle}
/* خلاصه بازی */
.winner{background:var(--deed);color:var(--deed-ink);border:2px solid #fff;border-radius:14px;padding:18px;text-align:center}
.winner .n{font-size:28px;font-weight:900}
.rank{display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-right:4px solid}
.chart{background:var(--raised);border-radius:14px;padding:10px 6px 4px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:8px 6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<script>
(() => {
'use strict';
const VERSION = '1.2.0';
const KEY = 'mnp-web-v1';
const MSG_INSUF = 'موجودی کافی نیست.';

// ───────── ابزار ─────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const latin = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const parseAmt = s => { const d = latin(s).replace(/[^0-9]/g, ''); return d ? parseInt(d, 10) : 0; };
const two = n => String(n).padStart(2, '0');
const hms = d => `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`;
let fDate, fShort;
try {
  fDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', {day: 'numeric', month: 'long', year: 'numeric'});
  fShort = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', {year: 'numeric', month: '2-digit', day: '2-digit'});
} catch (e) { fDate = fShort = new Intl.DateTimeFormat('fa-IR'); }
const jLong = d => fDate.format(d);
const stamp = t => `<bdi class="num">${esc(fShort.format(new Date(t)))} - ${hms(new Date(t))}</bdi>`;
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${two(Math.floor(s / 60) % 60)}:${two(s % 60)}`; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const hasWebNfc = 'NDEFReader' in window;

// ───────── داده‌ها (فقط روی همین گوشی) ─────────
let S;
const blank = () => ({v: 1, seq: 1, cards: [], games: [], pending: null, draft: null,
  app: {sound: true, awake: true, phone: '', currency: 'تومان', allowNegative: false, confirm: true, base: ''}});
function load() {
  try { const r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : blank(); } catch (e) { S = blank(); }
  const b = blank(); S.app = Object.assign(b.app, S.app || {});
  S.cards ||= []; S.games ||= []; S.seq ||= 1;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('ذخیره روی این گوشی ممکن نشد. از تنظیمات پشتیبان بگیرید.'); }
}
const nid = () => S.seq++;
class MoneyError extends Error {}
/** همه تغییرات مالی: یا کامل، یا هیچ. */
function atomic(fn) {
  const snap = JSON.stringify(S);
  try { const r = fn(); save(); return r; }
  catch (e) { S = JSON.parse(snap); throw e; }
}

const game = () => S.games.find(g => g.status === 'active') || null;
const P = (g, id) => g.players.find(p => p.id === id);
const cur = () => (game()?.settings.currency) || S.app.currency;
const money = (n, signed) => `<bdi class="num">${signed && n > 0 ? '+' : ''}${fmt(n)}</bdi> <small class="muted">${esc(cur())}</small>`;
const norm = c => String(c || '').trim().toLowerCase();
const cardByCode = code => S.cards.find(c => norm(c.code) === norm(code)) || null;
const cardByUid = uid => uid ? S.cards.find(c => c.uid && c.uid === uid) || null : null;
const playerByCard = (g, code) => g ? g.players.find(p => p.card && norm(p.card) === norm(code)) || null : null;

// ───────── ظاهر کارت ─────────
const COLORS = [['مشکی','1E1E22'],['سفید','F2F2F2'],['قرمز','D7263D'],['آبی','2F6FE0'],['سبز','1E9E5A'],['زرد','F5C518'],
  ['نارنجی','F08A24'],['بنفش','7B4FD6'],['صورتی','E85D9E'],['فیروزه‌ای','14B8B0'],['قهوه‌ای','8B5A3C'],['طلایی','E9B949'],['نقره‌ای','A8B0BD']];
const DESIGNS = [['hammer','چکش','🔨'],['skate','اسکیت کفشی','🛼'],['f1','فرمول ۱','🏎️'],['pickup','وانت','🛻'],['dog','سگ','🐕'],
  ['plane','هواپیما','✈️'],['phone','موبایل','📱'],['skateboard','اسکیت‌برد','🛹'],['hat','کلاه','🎩'],['boot','چکمه','👢'],['cat','گربه','🐈'],
  ['ship','کشتی','🚢'],['car','ماشین','🚗'],['train','قطار','🚂'],['rocket','موشک','🚀'],['duck','اردک','🦆'],['dino','دایناسور','🦖'],
  ['penguin','پنگوئن','🐧'],['house','خانه','🏠'],['star','ستاره','⭐'],['heart','قلب','❤️'],['diamond','الماس','💎'],['crown','تاج','👑'],
  ['flower','گل','🌸'],['ball','توپ','⚽'],['game','دسته بازی','🎮'],['music','موسیقی','🎵']];
const emoji = d => (DESIGNS.find(x => x[0] === d) || [])[2] || '💳';
const hexOf = c => c && c.color ? '#' + c.color.slice(-6) : '#3A4666';
function lum(hex) { const n = parseInt(hex.slice(1), 16); const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(n >> 16) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); }
const fgOf = hex => lum(hex) > .5 ? '#1C1C1C' : '#fff';
const swatch = c => `<span class="sw8" style="background:${hexOf(c)}">${emoji(c?.design)}</span>`;
const chip = c => c ? `<span class="chip" style="background:${hexOf(c)};color:${fgOf(hexOf(c))}">${emoji(c.design)} ${esc(c.name)}</span>` : '';

// ───────── فرمت کارت: base#mnp=1~کد~نام~رنگ~طرح~تلفن (همان فرمت اپ اندروید) ─────────
function payload(c) {
  const f = v => encodeURIComponent(String(v ?? '').replace(/~/g, '-'));
  return ['1', f(c.code), f(c.name), c.color ? f('ff' + c.color.slice(-6).toLowerCase()) : '', f(c.design || ''), f(dialable(c.phone) || '')].join('~');
}
function parsePayload(s) {
  const f = String(s).split(/[~|]/).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (f[0] !== '1' || !f[1] || !f[2]) return null;
  return {code: f[1], name: f[2], color: f[3] ? f[3].slice(-6).toUpperCase() : '', design: f[4] || '', phone: f[5] || ''};
}
function parseCardUrl(u) { const i = String(u).indexOf('#mnp='); return i < 0 ? null : parsePayload(String(u).slice(i + 5)); }
function baseUrl() { return (S.app.base || '').trim(); }
function cardLink(c) { const b = baseUrl(); return b ? b.replace(/#.*$/, '') + '#mnp=' + payload(c) : ''; }
function dialable(p) { const x = latin(p).replace(/[\s\-()]/g, ''); return /^\+?\d{7,15}$/.test(x) ? x : ''; }

// ───────── لوگو ─────────
const LOGO = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect width="120" height="120" rx="26" fill="#121A2B"/>
  <g transform="rotate(-10 60 64)">
    <rect x="18" y="34" width="84" height="56" rx="8" fill="#F4EFE3" stroke="#fff" stroke-width="2"/>
    <rect x="18" y="34" width="84" height="17" rx="8" fill="#D7263D"/><rect x="18" y="44" width="84" height="7" fill="#D7263D"/>
    <rect x="28" y="60" width="18" height="13" rx="3" fill="#E9B949"/>
    <text x="60" y="47" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="10" fill="#fff" letter-spacing="1">MONOPOLY</text>
    <path d="M70 60 a10 10 0 0 1 0 14 M76 56 a16 16 0 0 1 0 22 M82 52 a22 22 0 0 1 0 30" fill="none" stroke="#1F5FB8" stroke-width="3.2" stroke-linecap="round"/>
  </g></svg>`;
const standalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function installSheet() {
  return overlay(`<div class="install">${LOGO}<div><h3 style="margin:0">کارتخوان مونوپولی</h3><div class="muted" style="font-size:14px">آیکون برنامه را روی صفحه اصلی iPhone بگذارید</div></div></div>
    <ol class="steps">
      <li><span>در Safari، دکمه اشتراک‌گذاری <span class="share">⬆︎</span> را پایین صفحه بزنید.</span></li>
      <li><span>گزینه <b>Add to Home Screen</b> را انتخاب کنید (اگر نبود، فهرست را پایین بکشید).</span></li>

const CHART = ['#E9B949', '#4F8EF7', '#E5484D', '#2FBF71', '#F08A24', '#9B7BEA', '#E85D9E', '#14B8B0', '#B5BCC9', '#C08457'];

const compact = v => { const a = Math.abs(v); const f = (x, d) => (x / d).toFixed(x % d === 0 ? 0 : 1);

  const W = 340, H = 200, L = 40, Rr = 6, T = 8, B = 18, w = W - L - Rr, h = H - T - B;

  const pad = Math.max((hi - lo) * 0.12, Math.abs(hi) * 0.02, 1); lo = lo - pad; hi = hi + pad;
  const y = v => T + h - (v - lo) / (hi - lo) * h, x = i => L + (n <= 1 ? 0 : i / (n - 1) * w);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${L}" x2="${L + w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${compact(Math.round(v))}</text>`; }
  if (lo < 0 && hi > 0) g += `<line x1="${L}" x2="${L + w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  g += `<text x="${L}" y="${H - 4}" font-size="9" fill="var(--muted)" text-anchor="start">شروع</text><text x="${L + w}" y="${H - 4}" font-size="9" fill="var(--muted)" text-anchor="end">پایان</text>`;
  for (let i = s.ps.length - 1; i >= 0; i--) {
    const l = s.series[s.ps[i].id]; let d = `M${x(0)} ${y(l[0])}`;
    for (let j = 1; j < l.length; j++) d += ` L${x(j)} ${y(l[j - 1])} L${x(j)} ${y(l[j])}`;
    g += `<path d="${d}" fill="none" stroke="${CHART[i % CHART.length]}" stroke-width="${i === 0 ? 3 : 2}" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="نمودار موجودی بازیکنان">${g}</svg>`;
}

  if (navigator.vibrate) navigator.vibrate(40);
  if (!S.app.sound || !actx) return;
  const now = actx.currentTime;
  [[1318.51, 0, .5], [1975.53, .085, .45]].forEach(([f, t, a]) => {
    const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o2.frequency.value = f * 2; o.type = o2.type = 'sine';
    const g2 = actx.createGain(); g2.gain.value = .18; o2.connect(g2).connect(g);
    o.connect(g).connect(actx.destination);
    g.gain.setValueAtTime(0, now + t); g.gain.linearRampToValueAtTime(a * .6, now + t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, now + t + .7);

}

const LABEL = {initial: 'موجودی اولیه', deposit: 'افزایش موجودی', withdraw: 'کاهش موجودی', transfer: 'انتقال', reversal: 'برگشت تراکنش', bankruptcy: 'ورشکستگی'};
const KIND = {withdraw_all: 'کاهش همگانی', deposit_all: 'افزایش همگانی', transfer_all: 'انتقال به بقیه', reversal: 'برگشت عملیات همگانی'};
const txLabel = t => KIND[t.kind] || LABEL[t.type];
function move(g, o) {
  if (!Number.isInteger(o.amount) || o.amount <= 0) throw new MoneyError('مبلغ نامعتبر است.');
  const s = o.from != null ? P(g, o.from) : null, r = o.to != null ? P(g, o.to) : null;
  if (s && !g.settings.allowNegative && s.balance < o.amount) throw new MoneyError(MSG_INSUF);
  const t = {id: nid(), t: o.at || Date.now(), type: o.type, from: o.from ?? null, to: o.to ?? null, amount: o.amount,
    batch: o.batch || null, kind: o.kind || null, rev: o.rev || null};

}
const needGame = () => { const g = game(); if (!g) throw new MoneyError('بازی فعالی وجود ندارد.'); return g; };

const opWithdraw = (pid, a) => atomic(() => move(needGame(), {type: 'withdraw', from: pid, amount: a}));
const opTransfer = (f, to, a) => atomic(() => { if (f === to) throw new MoneyError('پرداخت‌کننده و دریافت‌کننده یکی هستند.'); return move(needGame(), {type: 'transfer', from: f, to, amount: a}); });

});
const opDepositAll = a => atomic(() => {
  const g = needGame(); if (!g.players.length) throw new MoneyError('بازیکنی وجود ندارد.');
  const batch = uuid(), at = Date.now();

const opBankrupt = (from, to) => atomic(() => {

/** ورودی: {uid?, data?} ← کارت در بانک کارت‌ها (در صورت نیاز خودکار ثبت می‌شود) */
function resolveCard({uid, data}) {
  let c = (data && cardByCode(data.code)) || cardByUid(uid);
  if (c) { if (uid && !c.uid && !cardByUid(uid)) { c.uid = uid; save(); } return c; }
  if (!data) return null;
  let code = data.code;
  for (let i = 2; cardByCode(code); i++) code = `${data.code}-${i}`;
  c = {code, name: data.name, color: data.color || '', design: data.design || '', phone: data.phone || '', uid: uid || ''};
  S.cards.push(c); save();
  toast(`«${c.name}» از روی کارت شناسایی و به بانک کارت‌ها اضافه شد.`);
  return c;
}
async function handleCard(input) {
  unlockAudio();
  if (resolver) close();
  let c = resolveCard(input);
  if (!c) {
    if (!input.uid) return;
    if (!await confirmBox('این کارت ثبت نشده است.', [['شناسه کارت', `<bdi class="num">${esc(input.uid)}</bdi>`]], {ok: 'ثبت کارت'})) return;
    return go('cardEdit', {uid: input.uid, fresh: true});
  }
  const g = game(), pd = pendingFresh() ? S.pending : null;
  if (pd && pd.kind === 'draftCard') { clearPending(); return draftAddWithCard(c); }
  if (pd && g) {
    const p = playerByCard(g, c.code);
    if (!p) { await errorBox(`«${c.name}» در این بازی به بازیکنی وصل نیست.`); return go('wait'); }
    if (pd.kind === 'transfer') return finishTransfer(pd.from, p.id, pd.amount);
    if (pd.kind === 'payerAll') return finishTransferAll(p.id);
    if (pd.kind === 'bankrupt') return finishBankrupt(pd.from, p.id);
  }
  if (ui.s === 'cards' || ui.s === 'cardEdit') return go('cardEdit', {code: c.code});
  if (!g) { toast(`«${c.name}» شناسایی شد. برای استفاده، بازی جدید بسازید.`); return go(ui.s === 'newgame' ? 'newgame' : 'home'); }
  const p = playerByCard(g, c.code);
  if (p) return go('player', {pid: p.id});
  if (!await confirmBox(`«${esc(c.name)}» در این بازی به بازیکنی وصل نیست.`, [['کارت', chip(c)]], {ok: 'وصل به بازیکن'})) return;
  linkCardFlow(c);
}
async function linkCardFlow(c) {
  const g = game();
  const v = await pickPlayer(`«${esc(c.name)}» برای کدام بازیکن است؟`, g.players, {extra: `<button class="btn green" style="margin-top:12px" data-a="close" data-v="new">＋ بازیکن جدید</button>`});
  if (v == null) return;
  if (v === 'new') {
    const r = await nameBox(`بازیکن «${esc(c.name)}»`, {balance: g.players[0]?.initial ?? 15000000}); if (!r) return;
    if (g.players.some(p => p.name === r.name)) return errorBox('نام بازیکنان نباید تکراری باشد.');
    atomic(() => { const p = {id: nid(), name: r.name, initial: r.balance, balance: 0, card: c.code}; g.players.push(p); move(g, {type: 'initial', to: p.id, amount: r.balance || 0}); });
    return go('player', {pid: g.players[g.players.length - 1].id});
  }
  const p = P(g, v);
  if (p.card && !await confirmBox('جایگزینی کارت', [['بازیکن', esc(p.name)], ['کارت فعلی', chip(cardByCode(p.card)) || esc(p.card)], ['کارت جدید', chip(c)]])) return;
  p.card = c.code; save(); go('player', {pid: p.id});
}

// Web NFC (Chrome اندروید)
let nfcOn = false, reader = null, lastRead = {uid: '', at: 0}, writing = null;
async function startNfc() {
  unlockAudio();
  try {
    reader = new NDEFReader(); await reader.scan(); nfcOn = true;
    reader.onreading = e => {
      if (writing) return;
      const uid = (e.serialNumber || '').toUpperCase();
      if (uid && uid === lastRead.uid && Date.now() - lastRead.at < 1500) return;
      lastRead = {uid, at: Date.now()};
      let data = null; const dec = new TextDecoder();
      for (const r of e.message.records) {
        try {
          if (r.recordType === 'url' || r.recordType === 'absolute-url') data ||= parseCardUrl(dec.decode(r.data));
          else if (r.recordType === 'mnp.app:card') data ||= parsePayload(dec.decode(r.data));
        } catch (x) {}
      }
      handleCard({uid, data});
    };
    reader.onreadingerror = () => toast('کارت خوانده نشد. دوباره نزدیک کنید.');
    toast('NFC روشن شد. کارت را پشت گوشی بگیرید.'); render();
  } catch (e) { errorBox('NFC روشن نشد. NFC گوشی را روشن کنید و اجازه دسترسی بدهید.'); }
}
async function writeCard(c) {
  if (!hasWebNfc) return errorBox('نوشتن روی کارت در این مرورگر ممکن نیست.');
  const link = cardLink(c);
  const enc = new TextEncoder();
  const records = link ? [{recordType: 'url', data: link}] : [{recordType: 'mnp.app:card', data: enc.encode(payload(c))}];
  const ac = new AbortController(); writing = ac;
  overlay(`<div class="nfc">💳</div><h3 style="text-align:center">کارت «${esc(c.name)}» را نزدیک کنید و نگه دارید</h3><button class="btn ghost" data-a="close">لغو</button>`).then(() => ac.abort());
  try { await new NDEFReader().write({records}, {signal: ac.signal, overwrite: true}); close(); chime(); toast(`مشخصات روی «${c.name}» نوشته شد.`); }
  catch (e) { if (e.name !== 'AbortError') { close(); errorBox('نوشتن انجام نشد. کارت را ثابت نگه دارید و دوباره امتحان کنید.'); } }
  finally { writing = null; }
}

async function draftAddWithCard(c) {
  const d = draft(); go('newgame');
  if (d.players.some(p => norm(p.card) === norm(c.code))) return errorBox('این کارت قبلاً به یک بازیکن اختصاص داده شده است.');
  const r = await nameBox(`بازیکن «${esc(c.name)}»`, {balance: d.balance}); if (!r) return;
  if (d.players.some(p => p.name === r.name)) return errorBox('نام بازیکنان نباید تکراری باشد.');
  d.players.push({name: r.name, balance: r.balance || d.balance, card: c.code}); save(); render();
}
async function draftPickCard() {
  const d = draft(), used = new Set(d.players.map(p => norm(p.card)));
  const list = S.cards.filter(c => !used.has(norm(c.code)));
  const v = await overlay(`<h3>انتخاب کارت</h3><div class="list">${list.map(c => `<button class="item" data-a="close" data-v="${esc(c.code)}">${swatch(c)}<div class="grow"><div class="t">${esc(c.name)}</div><div class="s num">${esc(c.code)}</div></div></button>`).join('') || '<div class="empty">کارت آزادی در بانک کارت‌ها نیست. اول کارت ثبت کنید.</div>'}</div><button class="btn ghost" style="margin-top:12px" data-a="close">لغو</button>`, false);
  if (v == null) return;
  clearPending(); draftAddWithCard(cardByCode(v));
}
function startGame() {
  const d = draft();
  if (game()) return errorBox('یک بازی فعال وجود دارد. اول آن را تمام کنید.');
  atomic(() => {
    const g = {id: nid(), name: d.name.trim() || 'بازی', start: d.start, end: null, status: 'active',
      settings: {currency: d.currency || 'تومان', allowNegative: !!d.allowNegative, confirm: !!d.confirm}, players: [], txs: []};
    S.games.push(g);
    for (const x of d.players) { const p = {id: nid(), name: x.name, initial: x.balance, balance: 0, card: x.card}; g.players.push(p); if (x.balance > 0) move(g, {type: 'initial', to: p.id, amount: x.balance, at: d.start}); }
    S.draft = null;
  });
  toast('بازی شروع شد.'); go('home');
}

async function exportBackup() {
  const json = JSON.stringify({format: 'monopoly-nfc-web', version: 1, exportedAt: Date.now(), data: {...S, pending: null}});
  const name = `monopoly-backup-${new Date().toISOString().slice(0, 10)}.json`;
  try { const dl = window.claude?.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({filename: name, data: json}); return; } } catch (e) {}
  try {
    const file = new File([json], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'پشتیبان مونوپولی'}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

  try {
    const j = JSON.parse(text); if (j.format !== 'monopoly-nfc-web' || !j.data) throw 0;
    if (!await confirmBox('بازیابی پشتیبان', [['بازی‌ها', `<bdi class="num">${(j.data.games || []).length}</bdi>`], ['کارت‌ها', `<bdi class="num">${(j.data.cards || []).length}</bdi>`]], {msg: 'اطلاعات فعلی این صفحه با فایل پشتیبان جایگزین می‌شود.', ok: 'بازیابی', cls: 'orange'})) return;
    S = Object.assign(blank(), j.data); S.app = Object.assign(blank().app, j.data.app || {}); S.pending = null; save(); toast('پشتیبان بازیابی شد.'); go('home');
  } catch (e) { errorBox('فایل انتخاب‌شده پشتیبان این برنامه نیست.'); }
}

R.about = () => {
  const F = [['💳', 'کارتخوان بانکی', 'کارت بازیکن را نزدیک کنید تا نام، موجودی و آخرین تراکنش نمایش داده شود.'],
    ['＋', 'افزایش و کاهش موجودی', 'با صفحه‌کلید بزرگ، مبالغ آماده و دکمه‌های ۱۰، ۲۰ و ۳۰ درصد موجودی.'],
    ['⇄', 'انتقال بین بازیکنان', 'مبلغ، کارت گیرنده، تأیید. انتقال یا کامل انجام می‌شود یا اصلاً.'],
    ['👥', 'کاهش، افزایش و انتقال به بقیه', 'کسر از همه بازیکنان، افزودن به همه، یا پرداخت یک بازیکن به همه بقیه.'],
    ['🏳', 'ورشکستگی', 'بعد از اسکن کارت، کل موجودی بازیکن به بازیکن دیگر یا بانک منتقل می‌شود؛ در تاریخچه و خلاصه بازی ثبت و قابل برگشت است.'],
    ['🗂', 'بانک کارت‌ها', 'نام، کد، رنگ، طرح و شماره تماس هر کارت؛ کارت‌های تنظیم‌شده در اپ اندروید خودکار شناخته می‌شوند.'],
    ['↶', 'برگشت تراکنش', 'اشتباه‌ها با تراکنش معکوس اصلاح می‌شوند؛ چیزی پاک نمی‌شود.'],
    ['⏱', 'ساعت، تاریخ شمسی و زمان بازی', 'زمان بازی از لحظه واقعی شروع حساب می‌شود.'],
    ['🗄', 'تاریخچه، بازی‌های قبلی و پشتیبان', 'همه تراکنش‌ها با تاریخ و ساعت، و ذخیره در فایل.']];
  app.innerHTML = `${bar('درباره برنامه')}<div class="wrap" style="text-align:center"><div style="width:96px;margin:14px auto 0">${LOGO.replace('<svg ', '<svg style="width:96px;height:96px;border-radius:22px" ')}</div>
    <h2 style="margin:12px 0 0">کارتخوان مونوپولی</h2><p class="muted" style="margin:0">نسخه وب <bdi class="num">${VERSION}</bdi></p>
    <p style="text-align:right">پول کاغذی بازی را با کارت جایگزین می‌کند. موجودی هرگز روی کارت نیست و همه اطلاعات فقط روی همین گوشی می‌ماند. برنامه قوانین بازی را اجرا نمی‌کند و فقط کار بانک را انجام می‌دهد.</p>
    <div class="list" style="text-align:right">${F.map(([i, t, d]) => `<div class="item"><span style="font-size:24px;width:34px;text-align:center">${i}</span><div class="grow"><div class="t">${t}</div><div class="s">${d}</div></div></div>`).join('')}</div>
    <h2 class="sec" style="text-align:right">NFC در این نسخه</h2><div class="note" style="text-align:right">
    iPhone (XS و جدیدتر): کارت را بالای پشت گوشی بگیرید و روی اعلان بزنید؛ لینک روی کارت همین صفحه را باز می‌کند.<br>
    اندروید با Chrome: «روشن کردن NFC» را بزنید تا کارت‌ها مستقیم خوانده شوند.<br>
    هر گوشی بازی‌های خودش را دارد؛ اطلاعات بین گوشی‌ها مشترک نیست.</div></div>`;
};

// ───────── رویدادها ─────────
const A = {
  go: d => { const x = {}; if (d.pid) x.pid = Number(d.pid); if (d.gid) x.gid = Number(d.gid); if (d.code) x.code = d.code; if (d.fresh) x.fresh = true; go(d.to, x); },
  back: () => {
    const g = S.games.find(x => x.id === ui.gid);
    if (g && g.status === 'finished') return go('summary', {gid: g.id});
    if (ui.pid != null && game()) return go('player', {pid: Number(ui.pid)});
    go(game() ? 'home' : 'past');
  },
  scrim: (d, el, e) => { if (e.target === el) close(); },
  close: d => close(d.v === undefined ? undefined : d.v),
  nameok: () => {
    const n = document.getElementById('nb-n').value.trim(); const b = document.getElementById('nb-b');
    if (!n) return document.getElementById('nb-n').focus();
    close({name: n, balance: b ? parseAmt(b.value) : null});
  },
  menu: async () => {
    const v = await overlay(`<div class="list">${[['overview', 'موجودی همه بازیکنان'], ['history', 'تاریخچه کل بازی'], ['undo', 'برگشت آخرین تراکنش'], ['manual', 'انتخاب بازیکن از فهرست'],
      ['wall', 'کاهش همگانی'], ['dall', 'افزایش همگانی'], ['tall', 'انتقال به بقیه'], ['cards', 'بانک کارت‌ها'], ['settings', 'تنظیمات'], ['past', 'بازی‌های قبلی'], ['about', 'درباره برنامه'], ['end', 'پایان بازی']]
      .map(([k, t]) => `<button class="item" data-a="close" data-v="${k}"><div class="grow t" style="font-weight:600${k === 'end' ? ';color:var(--red)' : ''}">${t}</div></button>`).join('')}</div>`, false);
    if (!v) return;
    if (['overview', 'history', 'cards', 'settings', 'past', 'about'].includes(v)) return go(v);
    if (v === 'undo') return flowUndo();
    if (v === 'manual') return A.manual();
    if (v === 'wall') return flowWithdrawAll();
    if (v === 'dall') return flowDepositAll();
    if (v === 'tall') return flowTransferAll();
    if (v === 'end') {
      if (!await confirmBox('پایان بازی', [['بازی', esc(game().name)]], {msg: 'بازی تمام و با همه تراکنش‌ها در «بازی‌های قبلی» ذخیره می‌شود.', ok: 'پایان بازی', cls: 'red'})) return;
      const g = game(); g.status = 'finished'; g.end = Date.now(); save(); chime(); go('summary', {gid: g.id});
    }
  },
  manual: async () => { const g = game(); const v = await pickPlayer('انتخاب بازیکن', g.players); if (v != null) go('player', {pid: v}); },
  nfc: () => startNfc(),
  dep: () => flowDeposit(ui.pid), wd: () => flowWithdraw(ui.pid), tr: () => flowTransfer(ui.pid),
  wall: () => flowWithdrawAll(), dall: () => flowDepositAll(), tall: () => flowTransferAll(), bk: () => flowBankrupt(ui.pid),
  undo: d => flowUndo(d.pid != null ? Number(d.pid) : undefined),
  key: d => { const a = amt; a.pct = null; if (d.v === 'del') a.digits = a.digits.slice(0, -1); else { const nx = (a.digits + d.v).replace(/^0+/, ''); if (nx.length <= 13) a.digits = nx; } render(); },
  qadd: d => { const a = amt; const nx = parseInt(a.digits || '0', 10) + Number(d.v); if (String(nx).length <= 13) { a.digits = String(nx); a.pct = null; render(); } },
  pct: d => { const a = amt, p = P(game(), a.pid), x = Number(d.v), v = Math.floor(p.balance * x / 100); a.digits = v > 0 ? String(v) : ''; a.pct = x; render(); },
  amtok: () => { const a = amt, v = parseInt(a.digits || '0', 10); if (v > 0) { amt = null; a.done(v); } },
  amtcancel: () => { const a = amt; amt = null; a.done(null); go(a.pid != null && game() ? 'player' : 'home', {pid: a.pid}); },
  unpend: () => { const pd = S.pending; clearPending(); go(pd?.kind === 'draftCard' ? 'newgame' : pd?.kind === 'transfer' || pd?.kind === 'bankrupt' ? 'player' : 'home', {pid: pd?.from}); },
  waitpick: d => { const pd = S.pending; const pid = Number(d.v); if (pd.kind === 'transfer') finishTransfer(pd.from, pid, pd.amount); else if (pd.kind === 'bankrupt') finishBankrupt(pd.from, pid); else finishTransferAll(pid); },
  draftpick: () => draftPickCard(),
  dadd: () => setPending({kind: 'draftCard', title: 'افزودن بازیکن', prompt: 'کارت بازیکن را نزدیک کنید', sub: 'یا کارت را از فهرست انتخاب کنید.'}),
  drm: d => { S.draft.players.splice(Number(d.v), 1); save(); render(); },
  gstart: () => startGame(),
  cfc: d => { ui.form.color = d.v; render(); }, cfd: d => { ui.form.design = d.v; render(); },
  cfsave: () => saveCardForm(),
  cfwrite: () => { const c = cardByCode(ui.code); if (c) writeCard(c); },
  cfcopy: async () => { const c = cardByCode(ui.code); const l = cardLink(c); try { await navigator.clipboard.writeText(l); toast('لینک کارت کپی شد.'); } catch (e) { await overlay(`<h3>لینک کارت</h3><textarea class="inp num" dir="ltr" rows="5" readonly>${esc(l)}</textarea><button class="btn" style="margin-top:10px" data-a="close">بستن</button>`); } },
  cfdel: async () => {
    const c = cardByCode(ui.code); const p = playerByCard(game(), c.code);
    if (p) return errorBox(`این کارت در بازی فعال به «${p.name}» وصل است و حذف نمی‌شود.`);
    if (!await confirmBox('حذف از بانک کارت‌ها', [['کارت', chip(c)]], {ok: 'حذف', cls: 'red'})) return;
    S.cards = S.cards.filter(x => x !== c); save(); go('cards');
  },
  usehere: () => { S.app.base = location.href.replace(/#.*$/, ''); save(); render(); },
  export: () => exportBackup(),
  install: async () => { if (await installSheet()) { S.app.installSeen = true; save(); } },
  import: () => document.getElementById('imp').click(),
};
document.addEventListener('click', e => {
  unlockAudio();
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) { if (el.dataset.a !== 'scrim') e.stopPropagation(); f(el.dataset, el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-money]')) { const v = parseAmt(t.value); t.value = v ? fmt(v) : ''; }
  if (t.dataset.draft) { const d = draft(), k = t.dataset.draft;
    d[k] = t.type === 'checkbox' ? t.checked : k === 'balance' ? parseAmt(t.value) : k === 'start' ? (new Date(t.value).getTime() || Date.now()) : t.value; save(); }
  if (t.dataset.cf) ui.form[t.dataset.cf] = t.value;
  if (t.dataset.set) { const g = game(), st = g ? g.settings : S.app; st[t.dataset.set] = t.type === 'checkbox' ? t.checked : t.value; save(); }
  if (t.dataset.app) { S.app[t.dataset.app] = t.type === 'checkbox' ? t.checked : t.value.trim(); save(); if (t.dataset.app === 'sound' && t.checked) { unlockAudio(); chime(); } keepAwake(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'imp' && e.target.files[0]) { const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(e.target.files[0]); e.target.value = ''; }
  if (e.target.matches('[data-draft="start"]')) render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && resolver) close(); if (e.key === 'Enter' && document.getElementById('nb-n')) A.nameok(); });
window.addEventListener('storage', e => { if (e.key === KEY) { load(); if (!resolver && ui.s !== 'amount') render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { load(); if (!resolver && ui.s !== 'amount') render(); } keepAwake(); });

// ساعت و زمان بازی
setInterval(() => {
  const now = new Date(), c = document.getElementById('clk'), t = document.getElementById('gtm'), d = document.getElementById('dte'), g = game();
  if (c) c.textContent = hms(now); if (d) d.textContent = jLong(now); if (t && g) t.textContent = dur(now - g.start);
}, 1000);

// کارتی که با لینک باز شده (iPhone: اعلان NFC ← Safari)
function fromHash() {
  const data = parseCardUrl(location.hash);
  if (!data) return false;
  history.replaceState(null, '', location.pathname + location.search);
  handleCard({data});
  return true;
}
window.addEventListener('hashchange', fromHash);
// جلوگیری از زوم: دو انگشت با gesturestart، دوبار ضربه با touch-action: manipulation
document.addEventListener('gesturestart', e => e.preventDefault());

load();
if (pendingFresh()) ui = {s: 'wait'}; else if (S.pending) { S.pending = null; save(); }
try { navigator.storage?.persist?.(); } catch (e) {}
if (!S.app.base && /github\.io$/.test(location.hostname)) { S.app.base = location.href.replace(/#.*$/, ''); save(); }
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
fromHash();
})();
</script>
